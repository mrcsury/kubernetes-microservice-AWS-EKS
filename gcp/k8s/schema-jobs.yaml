apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-push-auth
  namespace: blog
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: prisma-push
          image: asia-south1-docker.pkg.dev/YOUR_PROJECT_ID/blog-auth-service/blog-auth-service:latest
          command: ["npx", "prisma", "db", "push", "--skip-generate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: blog-secrets
                  key: db-auth-url
---
